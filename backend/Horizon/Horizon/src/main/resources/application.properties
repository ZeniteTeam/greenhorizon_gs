spring.application.name=Horizon
spring.profiles.active=test
spring.jpa.open-in-view=false
spring.sql.init.encoding=UTF-8

# Return the error message to the frontend (e.g. "limite diario atingido")
server.error.include-message=always

# Internal Python calculation service (backend/Calculations)
calculation.api.url=${CALCULATION_API_URL:http://localhost:8000}

# Satellite monitoring: re-analyze every field every 5 days at 06:00 (Brasilia),
# and on demand when a field's data is older than max-age.
monitoring.sync.cron=0 0 6 */5 * *
monitoring.sync.max-age=PT12H

# Leaf photos sent by farmers (kept as ground truth for a future dedicated model)
storage.photos-dir=${PHOTOS_DIR:./uploads/leaf-photos}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB
